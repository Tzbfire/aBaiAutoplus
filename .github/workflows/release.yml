name: Build Desktop & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version without leading v, for example 1.0.1'
        required: true
        default: '1.0.1'
      release_tag:
        description: 'Release tag, defaults to v<version>'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            release_tag="$REF_NAME"
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
            release_tag="$INPUT_RELEASE_TAG"
            if [ -z "$release_tag" ]; then
              release_tag="v$version"
            fi
          fi

          if [ -z "$version" ]; then
            echo "version is required" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release $release_tag with version $version"

  build-mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Build frontend
        run: cd frontend && npm ci --legacy-peer-deps && npm run build

      - name: Inject version
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "__version__ = \"$VERSION\"" > core/version.py
          cd electron && npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Build Python backend
        run: |
          PATCHRIGHT_DRIVER_DIR=$(python -c "import pathlib, patchright; print(pathlib.Path(patchright.__file__).parent / 'driver')")
          PATCHRIGHT_NODE="$PATCHRIGHT_DRIVER_DIR/node"
          if [ ! -f "$PATCHRIGHT_NODE" ]; then
            PATCHRIGHT_NODE="$PATCHRIGHT_DRIVER_DIR/node.exe"
          fi
          pyinstaller --onedir --name backend \
            --add-data "platforms:platforms" \
            --add-data "providers:providers" \
            --add-data "application:application" \
            --add-data "infrastructure:infrastructure" \
            --add-data "domain:domain" \
            --add-data "core:core" \
            --add-data "api:api" \
            --add-data "services:services" \
            --add-data "static:static" \
            --add-binary "$PATCHRIGHT_NODE:playwright/driver" \
            --add-data "$PATCHRIGHT_DRIVER_DIR/package:playwright/driver/package" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --hidden-import services.turnstile_solver.api_solver \
            --hidden-import services.turnstile_solver.db_results \
            --hidden-import services.turnstile_solver.browser_configs \
            --hidden-import services.turnstile_solver.start \
            --collect-all browserforge \
            --collect-all camoufox \
            --collect-all patchright \
            --collect-all rich \
            --collect-all apify_fingerprint_datapoints \
            --collect-all language_tags \
            --collect-all ua_parser \
            --collect-all ua_parser_builtins \
            --collect-all quart \
            --collect-all hypercorn \
            --collect-all aiofiles \
            --collect-all werkzeug \
            main.py
          mkdir -p electron/backend
          cp -r dist/backend electron/backend/

      - name: Build Electron (macOS)
        run: |
          cd electron
          npm ci --legacy-peer-deps
          npx electron-builder --mac --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Ad-hoc sign macOS app
        run: |
          APP_PATH=$(find electron/dist -maxdepth 2 -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
            echo "Signed: $APP_PATH"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  build-win:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build frontend
        run: cd frontend && npm ci --legacy-peer-deps && npm run build

      - name: Inject version
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "__version__ = `"$version`"" | Out-File -FilePath core/version.py -Encoding utf8
          cd electron
          npm version --no-git-tag-version --allow-same-version $version

      - name: Build Python backend
        shell: pwsh
        run: |
          $driverDir = python -c "import pathlib, patchright; print(pathlib.Path(patchright.__file__).parent / 'driver')"
          $nodePath = Join-Path $driverDir 'node.exe'
          if (-not (Test-Path $nodePath)) { $nodePath = Join-Path $driverDir 'node' }
          pyinstaller --onedir --name backend `
            --add-data "platforms;platforms" `
            --add-data "providers;providers" `
            --add-data "application;application" `
            --add-data "infrastructure;infrastructure" `
            --add-data "domain;domain" `
            --add-data "core;core" `
            --add-data "api;api" `
            --add-data "services;services" `
            --add-data "static;static" `
            --add-binary "$nodePath;playwright/driver" `
            --add-data "$driverDir/package;playwright/driver/package" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import services.turnstile_solver.api_solver `
            --hidden-import services.turnstile_solver.db_results `
            --hidden-import services.turnstile_solver.browser_configs `
            --hidden-import services.turnstile_solver.start `
            --collect-all browserforge `
            --collect-all camoufox `
            --collect-all patchright `
            --collect-all rich `
            --collect-all apify_fingerprint_datapoints `
            --collect-all language_tags `
            --collect-all ua_parser `
            --collect-all ua_parser_builtins `
            --collect-all quart `
            --collect-all hypercorn `
            --collect-all aiofiles `
            --collect-all werkzeug `
            main.py
          New-Item -ItemType Directory -Force -Path electron/backend
          Copy-Item -Recurse dist/backend electron/backend/

      - name: Build Electron (Windows)
        run: |
          cd electron
          npm ci --legacy-peer-deps
          npx electron-builder --win --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-builds
          path: |
            electron/dist/*.exe
            electron/dist/*.yml
            electron/dist/*.blockmap
          if-no-files-found: error

  build-docker:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/$repo" >> "$GITHUB_OUTPUT"

      - name: Inject version into source
        run: echo '__version__ = "${{ needs.prepare.outputs.version }}"' > core/version.py

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: '*-builds'
          path: dist/
          merge-multiple: true

      - name: List release files
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: aBaiAutoplus ${{ needs.prepare.outputs.release_tag }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
